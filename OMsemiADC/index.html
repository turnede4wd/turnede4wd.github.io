<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC電壓實時監控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button,
        .btn-link {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover,
        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        button:active,
        .btn-link:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #disconnectBtn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        #toggleConsoleBtn {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }

        #clearConsoleBtn {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }

        #toggleFlashDrawerBtn {
            background: linear-gradient(45deg, #f39c12, #d35400);
        }

        /* 精簡型 ESP32 燒錄展開欄 */
        .flash-drawer {
            display: none;
            max-width: 740px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .flash-drawer.open {
            display: block;
        }

        .flash-drawer-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .flash-drawer-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #ffd166;
        }

        .flash-drawer-meta {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 8px;
        }

        .flash-drawer-meta code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00f2fe;
        }

        .flash-drawer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .group-select {
            background: rgba(15, 23, 42, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .group-select:focus {
            border-color: #00f2fe;
        }

        .flash-drawer-actions button,
        .flash-drawer-actions .btn-link {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-link {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        #statusText {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .connected {
            color: #2ecc71;
        }

        .disconnected {
            color: #e74c3c;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 500px;
        }

        .console-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            max-height: 300px;
            transition: max-height 0.5s ease;
        }

        .console-container.collapsed {
            max-height: 40px;
        }

        .console-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-content {
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.2);
            color: #00ff9d;
        }

        .console-line {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-point {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .data-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #3498db;
        }

        .data-value {
            font-size: 2.2rem;
            font-weight: bold;
        }

        .adc0-value {
            color: #4facfe;
        }

        .adc1-value {
            color: #00f2fe;
        }

        .timestamp {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 350px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>ADC電壓實時監控系統</h1>
            <p class="subtitle">通過BLE連接ESP32，實時獲取並顯示ADC讀數</p>
        </header>

        <div class="controls">
            <button id="connectBtn">連接設備</button>
            <button id="disconnectBtn">斷開連接</button>
            <button id="toggleConsoleBtn">顯示控制台</button>
            <button id="clearConsoleBtn">清空控制台</button>
            <button id="toggleFlashDrawerBtn" aria-expanded="false" aria-controls="flashDrawer">ESP32 燒錄</button>
        </div>

        <div id="flashDrawer" class="flash-drawer">
            <div class="flash-drawer-top">
                <span class="flash-drawer-title">ESP32 固件燒錄</span>
                <div class="flash-drawer-actions">
                    <select id="groupSelect" class="group-select" aria-label="選擇組別固件">
                        <option value="01.bin">第 01 組 (01.bin)</option>
                        <option value="02.bin">第 02 組 (02.bin)</option>
                        <option value="03.bin">第 03 組 (03.bin)</option>
                        <option value="04.bin">第 04 組 (04.bin)</option>
                        <option value="05.bin">第 05 組 (05.bin)</option>
                        <option value="06.bin">第 06 組 (06.bin)</option>
                        <option value="07.bin">第 07 組 (07.bin)</option>
                        <option value="08.bin">第 08 組 (08.bin)</option>
                        <option value="09.bin">第 09 組 (09.bin)</option>
                        <option value="10.bin">第 10 組 (10.bin)</option>
                        <option value="11.bin">第 11 組 (11.bin)</option>
                        <option value="12.bin">第 12 組 (12.bin)</option>
                        <option value="13.bin">第 13 組 (13.bin)</option>
                        <option value="14.bin">第 14 組 (14.bin)</option>
                        <option value="15.bin">第 15 組 (15.bin)</option>
                        <option value="16.bin">第 16 組 (16.bin)</option>
                        <option value="17.bin">第 17 組 (17.bin)</option>
                        <option value="18.bin">第 18 組 (18.bin)</option>
                        <option value="19.bin">第 19 組 (19.bin)</option>
                        <option value="20.bin">第 20 組 (20.bin)</option>
                    </select>
                    <esp-web-install-button id="groupFlashBtn">
                        <button slot="activate" type="button">燒錄所選組別</button>
                    </esp-web-install-button>
                    <a id="downloadBinLink" class="btn-link" href="./01.bin" download="01.bin">下載 BIN</a>
                </div>
            </div>
            <p class="flash-drawer-meta">
                目前燒錄同級檔案：<code id="currentBinPath">./01.bin</code>（需 HTTPS 連線與支援 Web Serial 的瀏覽器）
            </p>
        </div>

        <div class="status">
            <span id="statusText" class="disconnected">未連接設備</span>
        </div>

        <div class="data-point">
            <div class="data-card">
                <div class="data-title">ADC0 電壓</div>
                <div class="data-value adc0-value">--.-- V</div>
                <div class="timestamp">最後更新: <span id="adc0Time">--:--:--</span></div>
            </div>

            <div class="data-card">
                <div class="data-title">ADC1 電壓</div>
                <div class="data-value adc1-value">--.-- V</div>
                <div class="timestamp">最後更新: <span id="adc1Time">--:--:--</span></div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="voltageChart"></canvas>
        </div>

        <div class="console-container">
            <div class="console-header" id="consoleHeader">
                <div>調試控制台</div>
                <div id="consoleStatus">▼</div>
            </div>
            <div class="console-content" id="consoleContent"></div>
        </div>
    </div>

    <script>
        // BLE UUIDs
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_ADC0_UUID = '2b7e8251-2877-41c3-b46e-cf057c562023';
        const CHAR_ADC1_UUID = '3b7e8251-2877-41c3-b46e-cf057c562023';

        // DOM元素
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const toggleConsoleBtn = document.getElementById('toggleConsoleBtn');
        const clearConsoleBtn = document.getElementById('clearConsoleBtn');
        const toggleFlashDrawerBtn = document.getElementById('toggleFlashDrawerBtn');
        const flashDrawer = document.getElementById('flashDrawer');
        const groupSelect = document.getElementById('groupSelect');
        const groupFlashBtn = document.getElementById('groupFlashBtn');
        const downloadBinLink = document.getElementById('downloadBinLink');
        const currentBinPath = document.getElementById('currentBinPath');
        const statusText = document.getElementById('statusText');
        const consoleContent = document.getElementById('consoleContent');
        const consoleContainer = document.querySelector('.console-container');
        const consoleHeader = document.getElementById('consoleHeader');
        const consoleStatus = document.getElementById('consoleStatus');
        const adc0Value = document.querySelector('.adc0-value');
        const adc1Value = document.querySelector('.adc1-value');
        const adc0Time = document.getElementById('adc0Time');
        const adc1Time = document.getElementById('adc1Time');

        // 儲存資料的陣列（最多100個點）
        let adc0Data = [];
        let adc1Data = [];
        const MAX_DATA_POINTS = 100;

        // BLE相關變數
        let device = null;
        let adc0Characteristic = null;
        let adc1Characteristic = null;
        let isConnected = false;

        // Chart.js實例
        let voltageChart = null;

        // 動態 manifest Blob URL
        let currentManifestUrl = null;

        // 更新所選組別的 manifest 與下載連結
        function updateGroupFirmware(binFileName) {
            const relativeUrl = new URL(`./${binFileName}`, window.location.href).href;
            const manifestObj = {
                name: `ESP32 Firmware - ${binFileName}`,
                version: '1.0.0',
                new_install_prompt_erase: true,
                builds: [
                    {
                        parts: [
                            {
                                path: relativeUrl,
                                offset: 0
                            }
                        ]
                    }
                ]
            };

            if (currentManifestUrl) {
                URL.revokeObjectURL(currentManifestUrl);
            }

            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            currentManifestUrl = URL.createObjectURL(blob);
            groupFlashBtn.setAttribute('manifest', currentManifestUrl);

            downloadBinLink.href = `./${binFileName}`;
            downloadBinLink.setAttribute('download', binFileName);
            currentBinPath.textContent = `./${binFileName}`;
        }

        // 初始化圖表（空圖表）
        function initChart() {
            const ctx = document.getElementById('voltageChart').getContext('2d');

            voltageChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'ADC0 電壓',
                            data: [],
                            borderColor: '#4facfe',
                            backgroundColor: 'rgba(79, 172, 254, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'ADC1 電壓',
                            data: [],
                            borderColor: '#00f2fe',
                            backgroundColor: 'rgba(0, 242, 254, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 3.5,
                            title: {
                                display: true,
                                text: '電壓 (V)',
                                color: '#aaa'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#aaa'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '採樣點',
                                color: '#aaa'
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#aaa'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ddd',
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            enabled: false
                        }
                    }
                }
            });
        }

        // 更新圖表資料
        function updateChart() {
            if (voltageChart) {
                voltageChart.data.datasets[0].data = adc0Data;
                voltageChart.data.datasets[1].data = adc1Data;

                // 僅在有資料時顯示點
                voltageChart.data.datasets[0].pointRadius = adc0Data.length > 0 ? 3 : 0;
                voltageChart.data.datasets[1].pointRadius = adc1Data.length > 0 ? 3 : 0;

                // 更新標籤
                const labels = [];
                for (let i = 0; i < Math.max(adc0Data.length, adc1Data.length); i++) {
                    labels.push(i + 1);
                }
                voltageChart.data.labels = labels;

                voltageChart.update();
            }
        }

        // 新增資料點（確保不超過最大數量）
        function addDataPoint(adc0, adc1) {
            if (!isConnected) return;

            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];

            adc0Data.push(adc0);
            adc1Data.push(adc1);

            adc0Value.textContent = adc0.toFixed(3) + " V";
            adc1Value.textContent = adc1.toFixed(3) + " V";
            adc0Time.textContent = timeString;
            adc1Time.textContent = timeString;

            if (adc0Data.length > MAX_DATA_POINTS) {
                adc0Data.shift();
            }
            if (adc1Data.length > MAX_DATA_POINTS) {
                adc1Data.shift();
            }

            updateChart();
        }

        // 重設圖表與資料
        function resetData() {
            adc0Data = [];
            adc1Data = [];
            adc0Value.textContent = "--.-- V";
            adc1Value.textContent = "--.-- V";
            adc0Time.textContent = "--:--:--";
            adc1Time.textContent = "--:--:--";
            updateChart();
        }

        // 新增日誌到控制台
        function logToConsole(message) {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            const logLine = document.createElement('div');
            logLine.className = 'console-line';
            logLine.textContent = `[${timeString}] ${message}`;
            consoleContent.appendChild(logLine);

            consoleContent.scrollTop = consoleContent.scrollHeight;
        }

        // 切換 ESP32 燒錄展開欄
        function toggleFlashDrawer() {
            const isOpen = flashDrawer.classList.toggle('open');
            toggleFlashDrawerBtn.setAttribute('aria-expanded', String(isOpen));
            toggleFlashDrawerBtn.textContent = isOpen ? '收合燒錄欄' : 'ESP32 燒錄';
        }

        // 連接 BLE 設備
        async function connectToDevice() {
            logToConsole('嘗試連接設備...');

            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                logToConsole(`找到設備: ${device.name}`);
                resetData();
                logToConsole('連接到 GATT 伺服器...');

                const server = await device.gatt.connect();
                logToConsole('GATT 伺服器已連接');

                const service = await server.getPrimaryService(SERVICE_UUID);
                logToConsole('服務已獲取');

                adc0Characteristic = await service.getCharacteristic(CHAR_ADC0_UUID);
                await adc0Characteristic.startNotifications();
                adc0Characteristic.addEventListener('characteristicvaluechanged', handleADC0Data);
                logToConsole('ADC0 通知已啟用');

                adc1Characteristic = await service.getCharacteristic(CHAR_ADC1_UUID);
                await adc1Characteristic.startNotifications();
                adc1Characteristic.addEventListener('characteristicvaluechanged', handleADC1Data);
                logToConsole('ADC1 通知已啟用');

                isConnected = true;

                statusText.textContent = `已連接到 ${device.name}`;
                statusText.className = 'connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                logToConsole('設備連接成功，開始接收資料...');
            } catch (error) {
                logToConsole(`連接失敗: ${error}`);
                statusText.textContent = '連接失敗';
                statusText.className = 'disconnected';
                isConnected = false;
            }
        }

        // 處理 ADC0 資料
        function handleADC0Data(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const voltage = parseFloat(decoder.decode(value));

            if (!isNaN(voltage)) {
                logToConsole(`收到 ADC0 資料: ${voltage.toFixed(3)}V`);
                const adc1Latest = adc1Data.length > 0 ? adc1Data[adc1Data.length - 1] : 0;
                addDataPoint(voltage, adc1Latest);
            }
        }

        // 處理 ADC1 資料
        function handleADC1Data(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const voltage = parseFloat(decoder.decode(value));

            if (!isNaN(voltage)) {
                logToConsole(`收到 ADC1 資料: ${voltage.toFixed(3)}V`);
                const adc0Latest = adc0Data.length > 0 ? adc0Data[adc0Data.length - 1] : 0;
                addDataPoint(adc0Latest, voltage);
            }
        }

        // 斷開設備連接
        async function disconnectDevice() {
            if (device && device.gatt.connected) {
                if (adc0Characteristic) {
                    await adc0Characteristic.stopNotifications();
                    adc0Characteristic.removeEventListener('characteristicvaluechanged', handleADC0Data);
                }

                if (adc1Characteristic) {
                    await adc1Characteristic.stopNotifications();
                    adc1Characteristic.removeEventListener('characteristicvaluechanged', handleADC1Data);
                }

                await device.gatt.disconnect();
                logToConsole('設備已斷開連接');
            }

            isConnected = false;
            device = null;
            adc0Characteristic = null;
            adc1Characteristic = null;

            statusText.textContent = '未連接設備';
            statusText.className = 'disconnected';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        // 切換控制台顯示
        function toggleConsole() {
            consoleContainer.classList.toggle('collapsed');
            consoleStatus.textContent = consoleContainer.classList.contains('collapsed') ? '►' : '▼';
            toggleConsoleBtn.textContent = consoleContainer.classList.contains('collapsed') ?
                '顯示控制台' : '隱藏控制台';
        }

        // 清空控制台
        function clearConsole() {
            consoleContent.innerHTML = '';
            logToConsole('控制台已清空');
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            updateGroupFirmware(groupSelect.value);

            connectBtn.addEventListener('click', connectToDevice);
            disconnectBtn.addEventListener('click', disconnectDevice);
            toggleConsoleBtn.addEventListener('click', toggleConsole);
            clearConsoleBtn.addEventListener('click', clearConsole);
            consoleHeader.addEventListener('click', toggleConsole);
            toggleFlashDrawerBtn.addEventListener('click', toggleFlashDrawer);
            groupSelect.addEventListener('change', (e) => updateGroupFirmware(e.target.value));

            disconnectBtn.disabled = true;
            isConnected = false;

            logToConsole('系統已啟動，點擊"連接設備"按鈕開始');
            logToConsole('設備名稱: ESP32_ADC_Server');
            logToConsole('ADC0 UUID: 2b7e8251-2877-41c3-b46e-cf057c562023');
            logToConsole('ADC1 UUID: 3b7e8251-2877-41c3-b46e-cf057c562023');
        });
    </script>
</body>

</html>
